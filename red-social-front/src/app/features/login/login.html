<section class="pagina-formulario">
    <h1>Ingresar</h1>
    <p class="text-body-secondary">Entrá para mostrar tu problema o ayudar a otros.</p>

    <form class="card" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label" for="usuarioOCorreo">Usuario o correo</label>
                <input
                    id="usuarioOCorreo"
                    type="text"
                    class="form-control"
                    formControlName="usuarioOCorreo"
                    autocomplete="username"
                    [class.is-invalid]="invalido('usuarioOCorreo')"
                />
                @if (invalido('usuarioOCorreo')) {
                    <div class="invalid-feedback">Ingresá tu usuario o tu correo.</div>
                }
            </div>

            <div class="mb-4">
                <label class="form-label" for="contrasena">Contraseña</label>
                <input
                    id="contrasena"
                    type="password"
                    class="form-control"
                    formControlName="contrasena"
                    autocomplete="current-password"
                    [class.is-invalid]="invalido('contrasena')"
                />
                @if (invalido('contrasena')) {
                    <div class="invalid-feedback">Ingresá tu contraseña.</div>
                }
            </div>
            @if (error()) {
                <div class="alert alert-danger" role="alert">{{ error() }}</div>
            }
            <button type="submit" class="btn btn-accion w-100" [disabled]="cargando()">Ingresar</button>
        </div>
    </form>

    <p class="mt-3 text-body-secondary">
        ¿No tenés cuenta? <a routerLink="/registro">Registrate</a>
    </p>
</section>
