<main class="acceso">
    <section class="acceso-marca">
        <img class="acceso-logo" src="personaje.png" alt="Personaje de TeResuelvo" />
        <h1 class="acceso-nombre">TeResuelvo</h1>
        <p class="acceso-lema">Entrá, mostrá tu problema o ayudá a resolverlos.</p> 
    </section>

    <section class="acceso-formulario">
        <form class="card" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
            <div class="card-body p-4">
                <h2 class="mb-4">Ingresar</h2>

                <div class="mb-3">
                    <label class="form-label" for="usuarioOCorreo">Usuario o correo</label>
                    <input
                        id="usuarioOCorreo"
                        type="text"
                        class="form-control"
                        formControlName="usuarioOCorreo"
                        autocomplete="username"
                        [class.is-invalid]="invalido('usuarioOCorreo')"
                    />
                    @if (invalido('usuarioOCorreo')) {
                        <div class="invalid-feedback">Ingresá tu usuario o tu correo.</div>
                    }
                </div>

                <div class="mb-4">
                    <label class="form-label" for="contrasena">Contraseña</label>
                    <input
                        id="contrasena"
                        type="password"
                        class="form-control"
                        formControlName="contrasena"
                        autocomplete="current-password"
                        [class.is-invalid]="invalido('contrasena')"
                    />
                    @if (invalido('contrasena')) {
                        <div class="invalid-feedback">Ingresá tu contraseña.</div>
                    }
                </div>

                @if (error()) {
                    <div class="alert alert-danger" role="alert">{{ error() }}</div>
                }

                <button type="submit" class="btn btn-accion w-100" [disabled]="cargando()">
                    Ingresar
                </button>

                <hr class="my-4" />

                <a class="btn btn-secundario w-100" routerLink="/registro">Crear cuenta nueva</a>
            </div>
        </form>
    </section>
</main>
