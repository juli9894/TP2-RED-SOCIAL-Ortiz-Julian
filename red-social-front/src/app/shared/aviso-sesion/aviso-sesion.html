@if (auth.avisoSesion()) {
    <div class="aviso-fondo" role="dialog" aria-modal="true" aria-labelledby="aviso-titulo">
        <div class="aviso-caja">
            <i class="bi bi-hourglass-split aviso-icono"></i>
            <h2 id="aviso-titulo">Tu sesión está por vencer</h2>
            <p>Quedan {{ minutos }} minutos. ¿Querés seguir conectado?</p>
            @if (error()) {
                <p class="aviso-error">{{ error() }}</p>
            }
            <div class="aviso-botones">
                <button class="btn btn-outline-light" type="button" (click)="salir()">
                    Cerrar sesión
                </button>
                <button
                    class="btn btn-warning"
                    type="button"
                    [disabled]="renovando()"
                    (click)="seguir()"
                >
                    Seguir conectado
                </button>
            </div>
        </div>
    </div>
}
