<header class="barra">
    <div class="barra-contenido">
        <a class="marca" routerLink="/publicaciones">
            <img class="marca-logo" src="personaje.png" alt="" height="48" />
            <span>TeResuelvo</span>
        </a>

        <nav class="acciones">
            @if (auth.usuarioActual(); as usuario) {
                @if (usuario.imagenPerfil) {
                    <img class="avatar" [src]="usuario.imagenPerfil" alt="" />
                } @else {
                    <i class="bi bi-person-circle avatar-icono"></i>
                }
                <span class="nombre-usuario">{{ usuario.nombre }}</span>
                <button type="button" class="btn btn-secundario btn-sm" (click)="salir()">
                    Salir
                </button>
            } @else {
                <a class="btn btn-secundario btn-sm" routerLink="/login">Ingresar</a>
                <a class="btn btn-accion btn-sm" routerLink="/registro">Registrarme</a>
            }
        </nav>
    </div>
</header>
