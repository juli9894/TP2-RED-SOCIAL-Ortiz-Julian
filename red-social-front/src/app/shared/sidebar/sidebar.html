<nav class="lateral" aria-label="Navegación principal">
    <a class="lateral-enlace" routerLink="/publicaciones" routerLinkActive="activo">
        <i class="bi bi-chat-square-text"></i>
        <span>Publicaciones</span>
    </a>
    @if (auth.usuarioActual()) {
        <a class="lateral-enlace" routerLink="/mi-perfil" routerLinkActive="activo">
            <i class="bi bi-person-circle"></i>
            <span>Mi perfil</span>
        </a>
    }
    @if (auth.usuarioActual()?.perfil === 'administrador') {
        <a class="lateral-enlace" routerLink="/dashboard/usuarios" routerLinkActive="activo">
            <i class="bi bi-people"></i>
            <span>Usuarios</span>
        </a>
        <a class="lateral-enlace" routerLink="/dashboard/estadisticas" routerLinkActive="activo">
            <i class="bi bi-bar-chart"></i>
            <span>Estadísticas</span>
        </a>
    }
</nav>
